<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solstime</title>
    <style>
      :root { color-scheme: dark; }
      html, body { width:100%; height:100%; margin:0; background:#111513; overflow:hidden; }
      body { display:grid; place-items:center; color:#f3f0e8; font:14px system-ui, sans-serif; }
      .loading { display:grid; place-items:center; gap:12px; color:#9da49b; }
      img { width:28px; height:28px; }
    </style>
  </head>
  <body>
    <div class="loading" aria-live="polite"><img src="icon.svg" alt="" />Loading your day</div>
    <script src="newtab.js"></script>
  </body>
</html>
