<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solstime</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing:border-box; }
      body { width:280px; margin:0; padding:20px; background:#111513; color:#f3f0e8; font:14px system-ui, sans-serif; }
      header { display:flex; align-items:center; gap:9px; margin-bottom:20px; font-weight:700; }
      img { width:22px; height:22px; }
      p { margin:0 0 18px; color:#9da49b; line-height:1.5; }
      a { display:block; border-radius:7px; background:#f7d08f; color:#20251f; padding:11px 12px; text-align:center; font-weight:700; text-decoration:none; }
      a:focus-visible { outline:2px solid #f1b56e; outline-offset:3px; }
    </style>
  </head>
  <body>
    <header><img src="icon.svg" alt="" /> <span>solstime</span></header>
    <p>A clear view of your day, tuned to the light outside.</p>
    <a href="https://solstime.day/?surface=extension" target="_blank" rel="noreferrer">Open the dial ↗</a>
  </body>
</html>
